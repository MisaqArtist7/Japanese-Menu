<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تکمیل خرید | ساکورا رامن</title>
  <meta name="theme-color" content="#faf6ee" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Vazirmatn:wght@300;400;500;700;900&family=Yuji+Syuku&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dist/style.css" />
</head>
<body class="min-h-screen">
  <div data-header></div>

  <main class="mx-auto max-w-6xl px-4 pt-8">
    <div id="checkout-head" class="text-center">
      <span class="rounded-full bg-shu/10 px-3.5 py-1 font-brush text-xs tracking-[.35em] text-shu">お会計 · CHECKOUT</span>
      <h1 class="mt-3 text-3xl font-black tracking-tight sm:text-4xl">تکمیل و ثبت سفارش</h1>

      <!-- Modern Progress Stepper -->
      <ol class="frame mx-auto mt-7 flex max-w-lg items-center justify-between px-6 py-4 text-xs font-bold">
        <li class="flex items-center gap-2.5">
          <span class="hanko size-8 text-xs">一</span>
          <span>سبد خرید</span>
        </li>
        <li class="mx-2 h-0.5 flex-1 rounded-full bg-gradient-to-l from-shu to-shu/40"></li>
        <li class="flex items-center gap-2.5">
          <span class="hanko size-8 text-xs">二</span>
          <span>اطلاعات و پرداخت</span>
        </li>
        <li class="mx-2 h-0.5 flex-1 rounded-full bg-ink/10" data-step-line></li>
        <li class="flex items-center gap-2.5 text-ink-soft">
          <span data-step3 class="grid size-8 place-items-center rounded-xl border border-ink/15 bg-paper font-brush text-xs">三</span>
          <span>ثبت نهایی</span>
        </li>
      </ol>
    </div>

    <div id="checkout" class="mt-10"></div>
  </main>

  <div data-footer></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
